<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Justice Den Logo</title>
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 40px; font-family: Arial, sans-serif; }
  .logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  h3 { color: #aaa; margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }
  canvas { display: none; }
</style>
</head>
<body>

<!-- Version 1: Shield + JD -->
<div class="logo-wrap">
  <h3>Version 1 — Shield</h3>
  <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#16213e"/>
        <stop offset="100%" style="stop-color:#0f3460"/>
      </linearGradient>
    </defs>
    <rect width="300" height="300" fill="url(#bg1)" rx="20"/>
    <!-- Shield -->
    <path d="M150 40 L220 70 L220 150 Q220 210 150 245 Q80 210 80 150 L80 70 Z" fill="#e94560" opacity="0.15"/>
    <path d="M150 50 L210 77 L210 150 Q210 203 150 235 Q90 203 90 150 L90 77 Z" fill="none" stroke="#e94560" stroke-width="3"/>
    <!-- JD text -->
    <text x="150" y="168" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="72" fill="#ffffff" letter-spacing="-2">JD</text>
    <!-- Justice Den below -->
    <text x="150" y="272" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="#4ecca3" letter-spacing="4">JUSTICE DEN</text>
  </svg>
</div>

<!-- Version 2: Circle badge -->
<div class="logo-wrap">
  <h3>Version 2 — Circle Badge</h3>
  <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <circle cx="150" cy="150" r="150" fill="#0f3460"/>
    <circle cx="150" cy="150" r="135" fill="none" stroke="#e94560" stroke-width="4"/>
    <circle cx="150" cy="150" r="120" fill="none" stroke="#e94560" stroke-width="1" opacity="0.4"/>
    <text x="150" y="130" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="28" fill="#4ecca3" letter-spacing="6">JUSTICE</text>
    <text x="150" y="185" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="64" fill="#ffffff">DEN</text>
    <line x1="60" y1="145" x2="120" y2="145" stroke="#e94560" stroke-width="2"/>
    <line x1="180" y1="145" x2="240" y2="145" stroke="#e94560" stroke-width="2"/>
    <text x="150" y="225" text-anchor="middle" font-family="Arial" font-size="13" fill="#aaa" letter-spacing="3">QUALITY · VALUE</text>
  </svg>
</div>

<!-- Version 3: Minimal square -->
<div class="logo-wrap">
  <h3>Version 3 — Clean Square</h3>
  <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="300" fill="#1a1a2e"/>
    <rect x="20" y="20" width="260" height="260" fill="none" stroke="#e94560" stroke-width="3" rx="8"/>
    <rect x="30" y="30" width="240" height="240" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3" rx="6"/>
    <!-- Big J -->
    <text x="90" y="210" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="160" fill="#e94560" opacity="0.2">J</text>
    <text x="150" y="160" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="80" fill="#ffffff">JD</text>
    <rect x="60" y="175" width="180" height="3" fill="#4ecca3"/>
    <text x="150" y="210" text-anchor="middle" font-family="Arial" font-size="16" fill="#4ecca3" letter-spacing="5" font-weight="bold">JUSTICE DEN</text>
    <text x="150" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa" letter-spacing="3">TRUSTED SELLER</text>
  </svg>
</div>

<p style="color:#555;font-size:12px;margin-top:10px">Click a button below to download as PNG — ready to upload to eBay</p>

<div style="display:flex;gap:16px;margin-bottom:40px">
  <button onclick="downloadLogo(0,'justice-den-shield')" style="background:#e94560;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold">⬇ Download Shield</button>
  <button onclick="downloadLogo(1,'justice-den-badge')" style="background:#e94560;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold">⬇ Download Badge</button>
  <button onclick="downloadLogo(2,'justice-den-square')" style="background:#e94560;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold">⬇ Download Square</button>
</div>

<script>
function downloadLogo(index, filename) {
  const svgs = document.querySelectorAll('svg');
  const svg = svgs[index];
  const svgData = new XMLSerializer().serializeToString(svg);
  const canvas = document.createElement('canvas');
  canvas.width = 500;
  canvas.height = 500;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  img.onload = function() {
    ctx.drawImage(img, 0, 0, 500, 500);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = filename + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.src = url;
}
</script>
</body>
</html>
